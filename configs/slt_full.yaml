name: slt_full

data:
  data_path: ./data/
  version: phoenix_2014_trans
  sgn: sign
  txt: text
  gls: gloss
  train: PHOENIX2014T/phoenix14t.pami0.train
  dev: PHOENIX2014T/phoenix14t.pami0.dev
  test: PHOENIX2014T/phoenix14t.pami0.test
  feature_size: 1024
  max_source_length: 400
  max_target_length: 30
  random_train_subset: -1
  random_dev_subset: -1

model:
  feature_size: 1024
  hidden_size: 512
  num_attention_heads: 8
  num_encoder_layers: 3
  num_decoder_layers: 3
  intermediate_size: 2048
  dropout: 0.1
  max_position_embeddings: 400

training:
  num_train_epochs: 10
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 32
  learning_rate: 5.0e-5
  warmup_steps: 1000
  weight_decay: 0.001
  logging_strategy: steps
  logging_steps: 100
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 1
  predict_with_generate: true
  generation_max_length: 30
  report_to:
    - wandb
  run_name: slt-full

  label_smoothing: 0.1
  recognition_loss_weight: 1.0
  translation_loss_weight: 1.0